# Tmux configuration
# Theme: Kanagawa Dragon

# General settings
set-option -sa terminal-overrides ",xterm*:Tc"
set -g mouse on
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

unbind C-b
set -g prefix C-a
bind C-a send-prefix

set -sg escape-time 0
set -g history-limit 50000
set -g display-time 4000
set -g status-interval 5
set -g focus-events on
setw -g aggressive-resize on

# Keybindings
bind r source-file ~/.tmux.conf \; display "Config reloaded!"

bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

bind c new-window -c "#{pane_current_path}"

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

bind -n M-h select-pane -L
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-l select-pane -R

bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

bind -n S-Left  previous-window
bind -n S-Right next-window

set-window-option -g mode-keys vi
bind-key -T copy-mode-vi v   send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y   send-keys -X copy-selection-and-cancel

bind '"' split-window -v -c "#{pane_current_path}"
bind %   split-window -h -c "#{pane_current_path}"

# Kanagawa Dragon colors
set -g status-position bottom
set -g status-style                 "bg=#12120f fg=#c5c9c5"
set -g window-status-style          "fg=#a6a69c"
set -g window-status-current-style  "fg=#7fb4ca bold"
set -g pane-border-style            "fg=#1d1c19"
set -g pane-active-border-style     "fg=#6a9589"
set -g message-style                "bg=#1d1c19 fg=#c5c9c5"

set -g status-left-length 20
set -g status-left  '#[fg=#6a9589,bold]  #S #[fg=#a6a69c]│ '

set -g window-status-format         ' #I:#W '
set -g window-status-current-format ' #I:#W '

set -g status-right-length 50
set -g status-right '#[fg=#a6a69c]%H:%M #[fg=#7fb4ca]%d %b'

set -g status-justify left

# Session management
bind Space switch-client -l
bind n     switch-client -n
bind p     switch-client -p
bind s     choose-tree -Zs
bind X     confirm-before -p "kill-session #S? (y/n)" kill-session

bind-key f run-shell "tmux neww tmux-sessionizer"
bind-key d run-shell "tmux neww dev"
bind-key i run-shell "tmux neww tmux-cht"

# Copy mode
bind [ copy-mode
bind ] paste-buffer

# Quality of life
set-option -g allow-rename off
set-window-option -g automatic-rename on
set-option -g set-titles on

set -g visual-activity off
set -g visual-bell     off
set -g visual-silence  off
setw -g monitor-activity off
set -g bell-action none

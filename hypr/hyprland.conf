# Hyprland config 
# Kanagawa Dragon theme

# Monitor (auto-detect)
monitor=,preferred,auto,1

# CRITICAL
env = WLR_NO_HARDWARE_CURSORS,1
env = WLR_RENDERER_ALLOW_SOFTWARE,1
env = XCURSOR_SIZE,24

# Autostart
exec-once = waybar
exec-once = mako
exec-once = /usr/lib/polkit-kde-agent/polkit-kde-authentication-agent-1

# Input
input {
    kb_layout = us
    follow_mouse = 1
    touchpad {
        natural_scroll = no
    }
}

general {
    gaps_in = 8
    gaps_out = 12
    border_size = 2
    col.active_border = rgba(7e9cd8ee) rgba(957fb8ee) 45deg
    col.inactive_border = rgba(29,28,25,aa)
    layout = dwindle
    allow_tearing = false
}

decoration {
    rounding = 12
    rounding_power = 2
    
    active_opacity = 1.0
    inactive_opacity = 0.95

    shadow {
        enabled = true
        range = 8
        render_power = 3
        color = rgba(0d0c0c99)
    }

    blur {
        enabled = true
        size = 6
        passes = 2
        ignore_opacity = true
        vibrancy = 0.2
    }
}

animations {
    enabled = yes
    
    bezier = easeOutExpo, 0.16, 1, 0.3, 1
    bezier = easeInOutBack, 0.68, -0.55, 0.265, 1.55
    
    animation = windows, 1, 6, easeOutExpo, popin 85%
    animation = windowsOut, 1, 5, easeOutExpo, popin 80%
    animation = border, 1, 8, easeOutExpo
    animation = borderangle, 1, 10, easeOutExpo
    animation = fade, 1, 5, easeOutExpo
    animation = workspaces, 1, 5, easeOutExpo, slidefadevert
    animation = specialWorkspace, 1, 5, easeInOutBack, slidevert
}

dwindle {
    pseudotile = yes
    preserve_split = yes
}

master {
    new_status = master
}

gestures {
    workspace_swipe = no
}

# Window rules
windowrule = float, ^(pavucontrol)$
windowrule = float, ^(wofi)$
windowrule = size 800 600, ^(pavucontrol)$

# Variables
$terminal = wezterm
$fileManager = dolphin
$menu = wofi --show drun --style=$HOME/.config/wofi/style.css
$screenshot = hyprshot -m region --clipboard-only

# Keybindings
bind = SUPER, Q, exec, $terminal
bind = SUPER, C, killactive,
bind = SUPER SHIFT, M, exit,
bind = SUPER, E, exec, $fileManager
bind = SUPER, V, togglefloating,
bind = SUPER, R, exec, $menu
bind = SUPER, P, pseudo,
bind = SUPER, J, togglesplit
bind = SUPER, F, fullscreen
bind = SUPER SHIFT, S, exec, $screenshot

# Move focus (vim keys)
bind = SUPER, h, movefocus, l
bind = SUPER, l, movefocus, r
bind = SUPER, k, movefocus, u
bind = SUPER, j, movefocus, d

# Move windows
bind = SUPER SHIFT, h, movewindow, l
bind = SUPER SHIFT, l, movewindow, r
bind = SUPER SHIFT, k, movewindow, u
bind = SUPER SHIFT, j, movewindow, d

# Workspaces
bind = SUPER, 1, workspace, 1
bind = SUPER, 2, workspace, 2
bind = SUPER, 3, workspace, 3
bind = SUPER, 4, workspace, 4
bind = SUPER, 5, workspace, 5
bind = SUPER, 6, workspace, 6
bind = SUPER, 7, workspace, 7
bind = SUPER, 8, workspace, 8
bind = SUPER, 9, workspace, 9
bind = SUPER, 0, workspace, 10

# Move to workspace
bind = SUPER SHIFT, 1, movetoworkspace, 1
bind = SUPER SHIFT, 2, movetoworkspace, 2
bind = SUPER SHIFT, 3, movetoworkspace, 3
bind = SUPER SHIFT, 4, movetoworkspace, 4
bind = SUPER SHIFT, 5, movetoworkspace, 5
bind = SUPER SHIFT, 6, movetoworkspace, 6
bind = SUPER SHIFT, 7, movetoworkspace, 7
bind = SUPER SHIFT, 8, movetoworkspace, 8
bind = SUPER SHIFT, 9, movetoworkspace, 9
bind = SUPER SHIFT, 0, movetoworkspace, 10

# Scroll through workspaces
bind = SUPER, mouse_down, workspace, e+1
bind = SUPER, mouse_up, workspace, e-1

# Mouse
bindm = SUPER, mouse:272, movewindow
bindm = SUPER, mouse:273, resizewindow

# Media keys
bindel = ,XF86AudioRaiseVolume, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bindel = ,XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindel = ,XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = ,XF86MonBrightnessUp, exec, brightnessctl s 10%+
bindel = ,XF86MonBrightnessDown, exec, brightnessctl s 10%-
